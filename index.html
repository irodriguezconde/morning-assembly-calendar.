<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Morning Assembly Calendar</title><style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap');
*{box-sizing:border-box}body{margin:0;font-family:Nunito,'Trebuchet MS',sans-serif;color:#442515;background:#fff0df}.app{min-height:100vh;padding:2.4vw;background:radial-gradient(circle at 12% 20%,#fff7c8 0 12%,transparent 13%),linear-gradient(145deg,#ffebd5,#ffe1dc 52%,#e5f3ff)}header{text-align:center}h1{font-size:clamp(30px,5vw,65px);line-height:1;margin:0;color:#ff6c85;text-shadow:3px 4px white}header p{margin:8px 0 20px;font-size:clamp(14px,1.7vw,22px)}.layout{display:grid;grid-template-columns:minmax(155px,23%) 1fr;gap:2vw;max-width:1300px;margin:auto}.teacher{border:6px solid white;border-radius:30px;background:linear-gradient(#ffe2c4,#ffb9d0);box-shadow:0 9px 20px #ad6a7840;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;text-align:center}.teacher .face{font-size:clamp(60px,10vw,130px);line-height:1.2}.teacher .bubble{font-size:clamp(16px,2vw,25px);font-weight:900;background:white;border-radius:22px;padding:14px 8px}.teacher small{font-size:12px;margin-top:10px}.panel{background:#ffffffcc;border:5px solid white;border-radius:30px;padding:2vw;box-shadow:0 8px 20px #ad6a7830}.section{margin-bottom:19px}.section h2{font-size:clamp(18px,2.4vw,30px);margin:0 0 10px;color:#6c4b9d}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{touch-action:none;cursor:grab;user-select:none;border:3px solid white;border-radius:15px;padding:9px 11px;font-size:clamp(12px,1.4vw,19px);font-weight:900;box-shadow:0 3px 6px #79554833;min-width:85px;text-align:center}.chip:focus-visible{outline:4px solid #4348a4}.chip.dragging{opacity:.5}.drop{min-height:72px;border:4px dashed #f2a7bf;background:#fff9ff;border-radius:19px;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;font-size:clamp(18px,2.1vw,29px);font-weight:900;color:#aa7292;margin:12px 0}.drop.over{background:#d9ffe7;border-color:#46ad71}.drop.filled{border-style:solid;color:#52315b;background:#f6e5ff}.month .chip{min-width:90px}.footer{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:10px}.reset{background:#ff7695;border:3px solid white;border-radius:16px;color:white;padding:11px 20px;font:900 17px Nunito,sans-serif;cursor:pointer;box-shadow:0 4px 10px #aa6b7833}.tip{font-size:13px;color:#826879}.day .chip:nth-child(7n+1){background:#ffc9d9}.day .chip:nth-child(7n+2){background:#ffe1a6}.day .chip:nth-child(7n+3){background:#d8f0b3}.day .chip:nth-child(7n+4){background:#bdeafb}.day .chip:nth-child(7n+5){background:#e1d0ff}.day .chip:nth-child(7n+6){background:#ffd7af}.day .chip:nth-child(7n+7){background:#f6c6ed}.month .chip:nth-child(4n+1){background:#fbd6e7}.month .chip:nth-child(4n+2){background:#fff0ad}.month .chip:nth-child(4n+3){background:#c9f1d4}.month .chip:nth-child(4n){background:#d6e5ff}@media(max-width:690px){.layout{grid-template-columns:1fr}.teacher{display:none}.app{padding:12px}.panel{padding:13px}.chip{min-width:76px;padding:8px}.month .chip{min-width:76px}.drop{min-height:60px}}
</style></head><body><main class="app"><header><h1>OUR CALENDAR!</h1><p>Let's find today's day and month! ☀️</p></header><div class="layout"><aside class="teacher"><div class="face" aria-hidden="true">👩🏼‍🏫</div><div class="bubble">Good morning, little explorers! 💗</div><small>Teacher illustration placeholder</small></aside><div class="panel"><section class="section day"><h2>🌈 DAYS OF THE WEEK</h2><div class="chips" id="days"></div><div class="drop" id="day-drop" data-kind="day" tabindex="0" aria-label="Today is. Drop a day here">TODAY IS... ✨</div></section><section class="section month"><h2>🌸 MONTHS OF THE YEAR</h2><div class="chips" id="months"></div><div class="drop" id="month-drop" data-kind="month" tabindex="0" aria-label="The month is. Drop a month here">THE MONTH IS... ✨</div></section><div class="footer"><span class="tip">Drag a card into each box, or tap a card.</span><button class="reset" id="reset">↻ START AGAIN</button></div></div></div></main><script>
const groups={day:['MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY','SUNDAY'],month:['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER']};let drag=null;function choose(kind,value){const el=document.getElementById(kind+'-drop');el.textContent=value;el.classList.add('filled');el.setAttribute('aria-label',(kind==='day'?'Today is ':'The month is ')+value)}for(const [kind,words] of Object.entries(groups)){const host=document.getElementById(kind==='day'?'days':'months');for(const word of words){const el=document.createElement('button');el.type='button';el.className='chip';el.textContent=word;el.draggable=true;el.addEventListener('click',()=>choose(kind,word));el.addEventListener('dragstart',e=>{drag={kind,value:word};e.dataTransfer.setData('text/plain',JSON.stringify(drag));e.dataTransfer.effectAllowed='move'});el.addEventListener('dragend',()=>{drag=null});host.append(el)}}for(const target of document.querySelectorAll('.drop')){target.addEventListener('dragover',e=>{e.preventDefault();target.classList.add('over')});target.addEventListener('dragleave',()=>target.classList.remove('over'));target.addEventListener('drop',e=>{e.preventDefault();target.classList.remove('over');let data=drag;try{data=JSON.parse(e.dataTransfer.getData('text/plain'))||drag}catch{}if(data&&data.kind===target.dataset.kind)choose(data.kind,data.value)})}document.getElementById('reset').addEventListener('click',()=>{for(const kind of Object.keys(groups)){const el=document.getElementById(kind+'-drop');el.textContent=kind==='day'?'TODAY IS... ✨':'THE MONTH IS... ✨';el.classList.remove('filled')}});
// Touch support for interactive whiteboards and tablets: pointer dragging with a ghost.
let active=null;document.addEventListener('pointerdown',e=>{const b=e.target.closest('.chip');if(!b||e.pointerType==='mouse')return;active={kind:b.closest('.day')?'day':'month',value:b.textContent,startX:e.clientX,startY:e.clientY,ghost:null}});document.addEventListener('pointermove',e=>{if(!active)return;if(!active.ghost&&Math.hypot(e.clientX-active.startX,e.clientY-active.startY)>12){const ghost=document.createElement('div');ghost.textContent=active.value;ghost.className='chip';ghost.style.cssText='position:fixed;pointer-events:none;z-index:999;background:#fff3ba;opacity:.9;';document.body.append(ghost);active.ghost=ghost}if(active.ghost){active.ghost.style.left=e.clientX+8+'px';active.ghost.style.top=e.clientY+8+'px'}});document.addEventListener('pointerup',e=>{if(!active)return;const hit=document.elementFromPoint(e.clientX,e.clientY)?.closest('.drop');if(hit&&hit.dataset.kind===active.kind)choose(active.kind,active.value);active.ghost?.remove();active=null});
</script></body></html>
